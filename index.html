<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15191D">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>QuickPull</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: one phone-first column under a sticky bar. Paint-marker yellow marks money and stock numbers, like a yard windshield. */
:root{
  --bg:#ECEDE9; --surface:#FFFFFF; --sunk:#E2E4DF; --ink:#15191D; --muted:#5C636A; --line:#D2D5CF;
  --action:#1D4E89; --action-ink:#FFFFFF; --marker:#F2C14E; --marker-ink:#1F1800;
  --ok:#1C7446; --ok-bg:#DBEFE2; --hold:#8F5B00; --hold-bg:#FAE9C4; --gone:#858B91; --bad:#B3261E; --bad-bg:#F7DDDA;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#111417; --surface:#1A1E22; --sunk:#22272C; --ink:#E8EBED; --muted:#9AA2A9; --line:#2D3339;
  --action:#6FA5E9; --action-ink:#0A1420; --marker:#E9BA40; --marker-ink:#1F1800;
  --ok:#5DCB8C; --ok-bg:#15301F; --hold:#EAB54C; --hold-bg:#382A0E; --gone:#6D747A; --bad:#F2897F; --bad-bg:#3B1815; color-scheme:dark}}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.1;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:1.9rem} h2{font-size:1.4rem} h3{font-size:1.15rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--action);outline-offset:2px}
a{color:var(--action)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:.875rem}
.label{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:760px;margin:0 auto;padding-block:10px;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.35rem;letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;gap:8px;margin-right:auto}
.brand i{display:inline-block;width:14px;height:14px;background:var(--marker);border-radius:3px;transform:rotate(45deg)}
.tabs{max-width:760px;margin:0 auto;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:8px 10px 10px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--action)}
.tabs .count{font-family:var(--f-mono);font-size:.75rem;background:var(--sunk);border-radius:999px;padding:1px 7px;margin-left:4px}
main{max-width:760px;margin:0 auto;padding-block:18px 100px;display:flex;flex-direction:column;gap:16px}
.banner{background:var(--hold-bg);color:var(--hold);border-radius:10px;padding:10px 14px;font-size:.9rem;font-weight:500}
.banner.bad{background:var(--bad-bg);color:var(--bad)} .banner.info{background:var(--sunk);color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:8px;padding:11px 16px;font-weight:700;background:var(--action);color:var(--action-ink);cursor:pointer;text-decoration:none;min-height:44px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.quiet{background:var(--sunk);color:var(--ink)}
.btn.good{background:var(--ok);color:var(--surface)}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.btn.sm{padding:6px 10px;min-height:34px;font-size:.875rem;border-radius:7px}
.btn.block{width:100%}
.linkbtn{border:0;background:none;color:var(--action);font-weight:600;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.inp{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;min-height:44px;width:100%}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:460px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.panel-h{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.panel-b{padding:14px 16px}
.vin{font-family:var(--f-mono);font-size:1.2rem;letter-spacing:.06em;text-transform:uppercase}
.money{font-family:var(--f-display);font-weight:800;font-variant-numeric:tabular-nums}
.stock{font-family:var(--f-mono);font-weight:600;background:var(--marker);color:var(--marker-ink);padding:2px 7px;border-radius:4px;font-size:.8rem}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.76rem;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.fast{background:var(--ok-bg);color:var(--ok)}
.chip.steady{background:var(--hold-bg);color:var(--hold)}
.chip.slow{background:var(--bad-bg);color:var(--bad)}
.chip.unknown{background:var(--sunk);color:var(--muted)}
.chip.pulled{background:var(--hold-bg);color:var(--hold)} .chip.listed{background:var(--sunk);color:var(--action)} .chip.sold{background:var(--ok-bg);color:var(--ok)} .chip.scrapped{background:var(--sunk);color:var(--gone)}
.verdict{border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--ink);color:var(--surface)}
.verdict .money{font-size:2.6rem;line-height:1;color:var(--marker)}
.verdict .muted{color:color-mix(in srgb,var(--surface) 70%,transparent)}
.verdict ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:2px}
.prow{border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.prow>button.ph{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:12px 16px;border:0;background:none;text-align:left;cursor:pointer;align-items:center}
.prow .nm{font-weight:600}
.prow .meta{grid-column:1/-1;display:flex;gap:8px 12px;flex-wrap:wrap;align-items:center;font-size:.85rem;color:var(--muted)}
.prow .val{text-align:right}
.prow .val b{display:block;font-family:var(--f-mono);font-size:1rem;color:var(--ink)}
.prow .detail{padding:0 16px 14px;display:flex;flex-direction:column;gap:12px}
.kv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:460px){.kv{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kv div{background:var(--sunk);border-radius:8px;padding:8px 10px}
.kv b{display:block;font-family:var(--f-mono);font-size:1rem}
.cam{position:relative;background:#000;border-radius:12px;overflow:hidden;aspect-ratio:4/3;max-width:100%}
.cam video{width:100%;height:100%;object-fit:cover}
.cam .box{position:absolute;left:8%;right:8%;top:38%;bottom:38%;border:3px solid var(--marker);border-radius:10px;box-shadow:0 0 0 999px rgb(0 0 0/.35)}
.cam .tip{position:absolute;left:0;right:0;bottom:10px;text-align:center;color:#fff;font-weight:600;font-size:.9rem}
.list .item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:12px 16px;border-top:1px solid var(--line);align-items:center}
.list .item:first-child{border-top:0}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.kpi b{display:block;font-family:var(--f-display);font-size:1.6rem;font-variant-numeric:tabular-nums}
.empty{text-align:center;padding:32px 16px;display:flex;flex-direction:column;gap:10px;align-items:center}
.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:999px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0/.12)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:999px;font-weight:600;z-index:20;max-width:calc(100% - 32px)}
.spinner{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;display:inline-block;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation:none}}
table.pt{width:100%;border-collapse:collapse;font-size:.9rem}
table.pt th,table.pt td{padding:8px 12px;border-top:1px solid var(--line);text-align:left;white-space:nowrap}
table.pt th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;border-top:0}
table.pt td:first-child{white-space:normal;min-width:160px}
.seg label{border-radius:999px;font-weight:600;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.seg label:has(input:checked){background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0/.12)}
.seg label input{accent-color:var(--action)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip-f{border:1.5px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:5px 11px;font-weight:600;font-size:.82rem;cursor:pointer}
.chip-f[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.dup{background:var(--hold-bg);color:var(--hold);border-radius:10px;padding:10px 14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:.9rem}
.sku{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.list .item{color:inherit;font:inherit}
textarea.inp{line-height:1.5}
</style>
</head>
<body>
<header class="top">
  <div class="top-in gut"><div class="brand"><i aria-hidden="true"></i>QuickPull</div><button class="linkbtn small" id="signout" hidden>Sign out</button></div>
  <nav class="tabs gut" id="tabs" aria-label="Sections" hidden></nav>
</header>
<main class="gut" id="app"><div class="empty"><span class="spinner"></span></div></main>
<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script src="config.js"></script>
<script>
/* ===== Settings you may want to tune ===== */
const FEE_RATE = 0.136;       // eBay final value fee, roughly, for car & truck parts
const FEE_FIXED = 0.40;       // per-order fee
const PACK = {S:2, M:4};      // boxes, tape, padding per part
const BINS = {'Modules':'A','Dash & audio':'B','Switches':'C','Sensors & cameras':'D','Engine bay (small)':'E','Lights & mirrors':'F','Keys & body':'G','Also found':'H'};

/* ===== Helpers ===== */
const $ = (s,el=document)=>el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = (n,d=0) => n==null||n===''||!isFinite(n) ? '—' : '$'+Number(n).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d});
const ago = t => { if(!t) return 'never'; const s=(Date.now()-new Date(t))/1000; if(s<90) return 'just now'; if(s<5400) return Math.round(s/60)+' min ago'; if(s<129600) return Math.round(s/3600)+' hr ago'; return Math.round(s/86400)+' days ago'; };
const sleep = ms => new Promise(r=>setTimeout(r,ms));
let toastT; const toast = m => { const t=$('#toast'); t.textContent=m; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,3000); };
const vName = v => [v.year,v.make,v.model].filter(Boolean).join(' ') || 'Decoding…';
const takeHome = (price,size) => price==null ? null : price*(1-FEE_RATE) - FEE_FIXED - (PACK[size]||4);
const chicagoDay = d => new Date(d).toLocaleDateString('en-CA',{timeZone:'America/Chicago'});
const today = () => chicagoDay(Date.now());
const soldUrl = (v,words='') => 'https://www.ebay.com/sch/i.html?'+new URLSearchParams({_nkw:`${v.year} ${v.make} ${v.model} ${words}`.trim(),_sacat:'6030',LH_Sold:'1',LH_Complete:'1',LH_ItemCondition:'3000',_sop:'16',_ipg:'240'});
const tpUrl = (v,words='') => 'https://www.ebay.com/sh/research?'+new URLSearchParams({marketplace:'EBAY-US',keywords:`${v.year} ${v.make} ${v.model} ${words}`.trim(),dayRange:'90',categoryId:'6030',tabName:'SOLD'});
const DEST = {pull:['fast','Pull area'],shred:['unknown','Shred'],waiting:['steady','Waiting on data']};
const CATS = [['modules','Computers & modules'],['electronics','Electronics'],['lights','Lights'],['mirrors','Mirrors'],['plastic','Plastic & trim'],['engine','Engine bay (small)'],['keys','Keys & security'],['other','Other'],['large','Large parts']];
const CATNAME = Object.fromEntries(CATS);
// Multi-select filter chips. S.cats is shared by every screen; empty = everything.
function chips(opts={}){
  const list = CATS.filter(([k])=> opts.large ? true : k!=='large');
  return `<div class="chips" role="group" aria-label="Filter by part type"><button class="chip-f" data-act="cat" data-c="" aria-pressed="${!S.cats.length}">All</button>${list.map(([k,l])=>`<button class="chip-f" data-act="cat" data-c="${k}" aria-pressed="${S.cats.includes(k)}">${l}</button>`).join('')}</div>`;
}
const catOk = c => !S.cats.length || S.cats.includes(c||'other');
const REASON = {under_cutoff:'Under the cutoff', never_pull:'On your Never-pull list', same_unit:'Same unit as another part', merged:'Merged into another part', no_data:'No price data yet'};
const destOf = v => v.decision || v.destination || 'waiting';

/* ===== Supabase ===== */
const CFG = window.QUICKPULL_CONFIG || {};
const configured = CFG.supabaseUrl && !/PASTE_/.test(CFG.supabaseUrl) && CFG.supabaseKey && !/PASTE_/.test(CFG.supabaseKey);
const sb = configured ? supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey) : null;
async function fn(body){
  const { data, error } = await sb.functions.invoke('ebay-lookup', { body, headers:{ apikey: CFG.supabaseKey } });
  if(error){ let msg=error.message; try{ const j=await error.context.json(); msg=j.error||msg; }catch{} throw new Error(msg); }
  return data;
}

/* ===== State ===== */
const S = { user:null, role:null, tab:'checkin', err:'', busy:{}, status:null,
  vinText:'', lastAdd:null, day:'today', cars:[], gather:{running:false, info:null},
  car:null, carData:null, showHidden:false, open:{},
  research:null, // {vehicle, text, preview, from, to}
  items:[], shelfFilter:'pulled', people:[], data:null, scanning:false, cats:[], dataQ:{days:30,make:'',model:'',sold_only:false,tab:'small'}, shelfQ:'', notCounted:false, large:null };
const isOwner = () => S.role==='owner';

/* ===== Rendering ===== */
function draw(){
  const tabs=$('#tabs');
  if(!S.user){ tabs.hidden=true; $('#signout').hidden=true; $('#app').innerHTML = configured ? vLogin() : vSetup(); return; }
  tabs.hidden=false; $('#signout').hidden=false;
  const list = isOwner() ? [['checkin','Check-in'],['research','Research'],['shelf','Shelf',S.items.filter(i=>i.status==='pulled'||i.status==='listed').length],['data','Data'],['settings','Settings']] : [['checkin','Check-in']];
  const cur = S.tab==='car' ? 'checkin' : S.tab;
  tabs.innerHTML=list.map(([k,l,c])=>`<button data-act="tab" data-t="${k}" ${cur===k?'aria-current="page"':''}>${l}${c?`<span class="count">${c}</span>`:''}</button>`).join('');
  const ae=document.activeElement, fid=ae?.id, sel=fid&&ae.selectionStart!=null?[ae.selectionStart,ae.selectionEnd]:null;
  const views={checkin:vCheckin, car:vCar, research:vResearch, shelf:vShelf, data:vData, settings:vSettings};
  $('#app').innerHTML = (S.err?`<div class="banner bad">${esc(S.err)}</div>`:'') + setupBanner() + (views[S.tab]||vCheckin)();
  if(fid){ const el=document.getElementById(fid); if(el){ el.focus({preventScroll:true}); if(sel&&el.setSelectionRange) try{ el.setSelectionRange(...sel);}catch{} } }
  if(S.scanning) attachCamera();
}
function setupBanner(){
  const st=S.status; if(!st||!isOwner()) return '';
  if(!st.ebay_keys) return `<div class="banner bad">eBay keys aren't set up yet. Add EBAY_CLIENT_ID and EBAY_CLIENT_SECRET in Supabase → Edge Functions → Secrets.</div>`;
  return '';
}
function vSetup(){ return `<div class="panel panel-b stack"><h2>Almost there</h2><p>Open <span class="mono">config.js</span> on GitHub and paste your Supabase Project URL and publishable key, then reload this page.</p></div>`; }
function vLogin(){
  return `<div class="stack" style="max-width:420px;margin:24px auto;width:100%"><h1>Sign in</h1><p class="muted">Use the email and password from Supabase → Authentication → Users.</p>
  <form id="login" class="panel panel-b stack"><label class="field"><span class="label">Email</span><input class="inp" id="em" type="email" autocomplete="username" required value="${esc(S.em||'')}"></label>
  <label class="field"><span class="label">Password</span><input class="inp" id="pw" type="password" autocomplete="current-password" required></label>
  <button class="btn block" ${S.busy.login?'disabled':''}>${S.busy.login?'<span class="spinner"></span> Signing in…':'Sign in'}</button></form></div>`;
}

/* ---- Check-in ---- */
function carsForDay(){
  const t=today(), y=chicagoDay(Date.now()-864e5);
  return S.cars.filter(c=>{ const d=chicagoDay(c.scanned_at); return S.day==='today'?d===t:S.day==='yesterday'?d===y:true; });
}
function vCheckin(){
  const list=carsForDay();
  const n=k=>list.filter(c=>destOf(c)===k).length;
  const g=S.gather.info, waiting=S.cars.filter(c=>c.status==='queued').length;
  const vinCount=S.vinText.split(/[\s,;]+/).filter(x=>x.replace(/[^A-Za-z0-9]/g,'').length>=17).length;
  return `<div class="panel"><div class="panel-b stack">
    <label class="field"><span class="label">Paste VINs, one per line</span><textarea class="inp mono" id="vinbox" rows="5" placeholder="1G1ZT58N47F123456&#10;2HGFB2F50CH123456" autocapitalize="characters" spellcheck="false" style="min-height:120px;resize:vertical">${esc(S.vinText)}</textarea></label>
    <div class="row"><button class="btn" data-act="add" ${S.busy.add||!vinCount?'disabled':''}>${S.busy.add?'<span class="spinner"></span> Adding…':`Check in ${vinCount||''} car${vinCount===1?'':'s'}`}</button><button class="btn ghost" data-act="camera">${S.scanning?'Stop camera':'Scan a barcode'}</button></div>
    ${S.scanning?`<div class="cam"><video id="camv" playsinline muted></video><div class="box"></div><div class="tip">Line up the VIN barcode · door jamb or windshield</div></div>`:''}
    ${S.lastAdd?`<div class="banner ${S.lastAdd.skipped.length?'':'info'}"><b>${S.lastAdd.added.length} checked in.</b> ${S.lastAdd.added.length?'Write each stock number on its windshield.':''}${S.lastAdd.skipped.length?`<br>Skipped: ${S.lastAdd.skipped.map(s=>`${esc(s.vin)} (${esc(s.reason)})`).join('; ')}`:''}</div>`:''}
  </div></div>
  ${waiting?`<div class="banner info row" style="gap:8px">${S.gather.running?'<span class="spinner"></span>':''}<span><b>${waiting} car${waiting>1?'s':''} waiting on eBay data.</b> ${S.gather.running?'Gathering now…':'The timer keeps working on them in the background.'}${g?.notes?.includes('daily_cap')?' eBay\'s daily lookup limit is reached; it picks up again tomorrow.':''}${g?.notes?.some(n=>/ebay_keys|ebay_auth/.test(n))?' eBay keys are missing or wrong.':''}</span></div>`:''}
  <div class="row between"><div class="seg" role="group" aria-label="Day">${[['today','Today'],['yesterday','Yesterday'],['week','Recent']].map(([k,l])=>`<button data-act="day" data-d="${k}" aria-pressed="${S.day===k}">${l}</button>`).join('')}</div>
   <span class="small muted">${list.length} in · ${n('pull')} pull · ${n('shred')} shred${n('waiting')?` · ${n('waiting')} waiting`:''}</span></div>
  ${list.length?`<div class="panel list">${list.map(carRow).join('')}</div>`:`<div class="panel empty"><p class="muted">No cars checked in ${S.day==='today'?'today':S.day==='yesterday'?'yesterday':'recently'}.</p></div>`}`;
}
function carRow(c){

/* ---- Research ---- */
function vResearch(){
  if(S.research) return researchPanel();
  const since=Date.now()-60*864e5;
  const by=new Map();
  for(const c of S.cars){ if(!c.platform||new Date(c.scanned_at)<since) continue; const g=by.get(c.platform)||{platform:c.platform,year:c.year,make:c.make,model:c.model,cars:0,value:0}; g.cars++; g.value=Math.max(g.value,Number(c.est_value||0)); by.set(c.platform,g); }
  const plats=[...by.values()].map(g=>({...g,info:S.platforms?.[g.platform]})).sort((a,b)=>(!!a.info?.researched_at - !!b.info?.researched_at) || (b.cars-a.cars) || (b.value-a.value));
  const done=plats.filter(p=>p.info?.researched_at).length;
  return `<div class="stack"><h1>Research queue</h1><p class="muted">Models you bought in the last 60 days, most common first. Open eBay's sold listings, copy the page, paste it here. One paste covers every part on that model.</p></div>
  <div class="kpis"><div class="kpi"><span class="label">Models</span><b>${plats.length}</b></div><div class="kpi"><span class="label">Researched</span><b>${done}</b></div><div class="kpi"><span class="label">To do</span><b>${plats.length-done}</b></div></div>
  ${plats.length?`<div class="panel list">${plats.map(p=>`<div class="item"><div><b>${esc(vName(p))}</b><div class="small muted">${p.cars} car${p.cars>1?'s':''} bought · ${p.info?.researched_at?'researched '+ago(p.info.researched_at):'not researched'}</div></div><button class="btn sm ${p.info?.researched_at?'quiet':''}" data-act="research" data-p="${esc(p.platform)}">Research</button></div>`).join('')}</div>`:`<div class="panel empty"><p class="muted">Check in some cars first.</p></div>`}`;

const SKU_CODE = {ecm:'ECM',bcm:'BCM',tcm:'TCM',abs:'ABS',fusebox:'FUSE',gateway:'GATE',telematics:'TELE',keyless:'KEYLS',fpdm:'FPDM',liftgate_mod:'LGMOD',seat_mod:'SEATMOD',parkassist:'PAMOD',radio:'RADIO',display:'DISP',hud:'HUD',cluster:'CLUS',amp:'AMP',hvac:'HVAC',media_hub:'USB',clock_dash:'DSW',window_master:'WMSW',headlight_sw:'HLSW',column_sw:'COLSW',sw_controls:'SWC',push_start:'PUSH',ignition:'IGN',seat_sw:'SEATSW',mirror_sw:'MIRSW',shifter:'SHIFT',overhead:'OVHD',front_camera:'FCAM',radar:'RADAR',backup_cam:'BCAM',bsm_sensor:'BSM',park_sensor:'PDC',tpms:'TPMS',steer_angle:'SAS',rain_sensor:'RAIN',maf:'MAF',o2:'O2',map_cam:'POS',throttle:'TB',coils:'COIL',injectors:'INJ',vvt:'VVT',purge:'PURGE',blend_door:'BLEND',blower_res:'BLWR',headlight_l:'HL-L',headlight_r:'HL-R',taillight_l:'TL-L',taillight_r:'TL-R',mirror_l:'MIR-L',mirror_r:'MIR-R',keyfob:'FOB',lock_act:'LOCK',window_motor:'WMOT',handle:'HNDL',rear_mirror:'RVM',center_caps:'CAPS',emblems:'EMB'};
function skuFor(stock,key,name,grade){
  const code = SKU_CODE[key] || (key.startsWith('d:') ? 'X-'+String(name||key).split(/\s+/).map(w=>w[0]).join('').toUpperCase().slice(0,5) : key.toUpperCase().replace(/[^A-Z0-9]+/g,'-').slice(0,8));
  const base = `${stock||'NA'}-${code}-${grade}`;
  let sku=base, n=2; while(S.items.some(i=>i.sku===sku)) sku=`${base}-${n++}`;
  return sku;
}
async function addToShelf(key,form){
  const d=S.carData, v=d.vehicle, p=d.parts.find(x=>x.key===key);
  const grade=form.grade.value, sold=p.sold_high!=null;
  const price=grade==='A'?(sold?p.sold_high:p.ask_high):grade==='B'?(sold?p.sold_median:p.ask_median):(sold?p.sold_low:p.ask_low);
  const spot=form.bin.value.trim();
  const row={vehicle_id:v.id,vin:v.vin,stock_no:v.stock_no,platform:v.platform,part_key:key,part_name:p.name,grade,shelf:(BINS[p.group]||'H')+(spot?'-'+spot:''),list_price:price!=null?Math.round(price*100)/100:null};
  for(let attempt=0;attempt<3;attempt++){
    row.sku=skuFor(v.stock_no,key,p.name,grade)+(attempt?`-${Date.now()%1000}`:'');
    const {data,error}=await sb.from('pm_items').insert(row).select().single();
    if(!error){ S.items.unshift(data); S.open[key]=false; toast(`${p.name} → ${row.sku} · bin ${row.shelf}`); draw(); return; }
    if(!/duplicate|unique/i.test(error.message)){ toast('Could not save'); return; }
  }
  toast('Could not save');
}

/* ===== Camera barcode scanning ===== */
let camStream=null, camTimer=null, zx=null;
async function startCamera(){
  S.scanning=true; draw();
  try{ camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false}); }
  catch(e){ S.scanning=false; draw(); toast('Camera blocked. Allow camera access for this site, or type the VIN.'); return; }
  attachCamera();
}
function attachCamera(){
  const v=$('#camv'); if(!v||!camStream) return;
  if(v.srcObject!==camStream){ v.srcObject=camStream; v.play().catch(()=>{}); }
  if(camTimer) return;
  const native = 'BarcodeDetector' in window ? new BarcodeDetector({formats:['code_39','code_128','data_matrix','qr_code','pdf417']}) : null;
  if(!native && window.ZXing && !zx){ zx=new ZXing.MultiFormatReader(); const h=new Map(); h.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[ZXing.BarcodeFormat.CODE_39,ZXing.BarcodeFormat.CODE_128,ZXing.BarcodeFormat.DATA_MATRIX,ZXing.BarcodeFormat.QR_CODE]); h.set(ZXing.DecodeHintType.TRY_HARDER,true); zx.setHints(h); }
  const c=document.createElement('canvas'), ctx=c.getContext('2d',{willReadFrequently:true});
  const tick=async()=>{
    const vid=$('#camv'); if(!S.scanning||!vid){ camTimer=null; return; }
    if(vid.readyState>=2 && vid.videoWidth){
      const w=vid.videoWidth, h=vid.videoHeight, bh=Math.round(h*0.4);
      c.width=Math.min(1600,w); c.height=Math.round(bh*c.width/w);
      ctx.drawImage(vid,0,(h-bh)/2,w,bh,0,0,c.width,c.height);
      let txt=null;
      try{
        if(native){ const r=await native.detect(c); txt=r[0]?.rawValue||null; }
        else if(zx){ const src=new ZXing.HTMLCanvasElementLuminanceSource(c); txt=zx.decodeWithState(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(src))).getText(); }
      }catch{}
      const m=txt && txt.toUpperCase().replace(/^I(?=[A-HJ-NPR-Z0-9]{17}$)/,'').match(/[A-HJ-NPR-Z0-9]{17}/);
      if(m){ stopCamera(); if(navigator.vibrate) navigator.vibrate(60); if(!S.vinText.includes(m[0])) S.vinText=(S.vinText.trim()?S.vinText.trim()+'\n':'')+m[0]; toast('VIN read: '+m[0]); draw(); return; }
    }
    camTimer=setTimeout(tick,180);
  };
  camTimer=setTimeout(tick,300);
}
function stopCamera(){ S.scanning=false; clearTimeout(camTimer); camTimer=null; if(camStream){ camStream.getTracks().forEach(t=>t.stop()); camStream=null; } draw(); }

  if(t.id==='pastebox'&&S.research){ const had=!!S.research.text; S.research.text=t.value; S.research.preview=null; if(had!==!!t.value) draw(); }
  if(t.id==='yfrom'&&S.research) S.research.yFrom=t.value;
  if(t.id==='yto'&&S.research) S.research.yTo=t.value;
  if(t.id==='psrc'&&S.research) S.research.src=t.value;
  if(t.id==='shelfq'){ S.shelfQ=t.value; draw(); }
});
document.addEventListener('submit',async e=>{
  e.preventDefault(); const f=e.target;
  if(f.id==='login'){
    S.em=$('#em').value.trim(); const pw=$('#pw').value;
    S.busy.login=true; S.err=''; draw();
    const {data,error}=await sb.auth.signInWithPassword({email:S.em,password:pw});
    S.busy.login=false;
    if(error){ S.err='That email and password didn\'t work.'; draw(); return; }
    S.user=data.user; S.err=''; draw(); afterLogin(); return;
  }
  if(f.dataset.form==='pulled') addToShelf(f.dataset.k,f);
  if(f.dataset.form==='item') updateItem(f.dataset.id,e.submitter?.value||'listed',f);
  if(f.dataset.form==='cutoff') saveCutoff(f);
  if(f.dataset.form==='role') setRole(f);
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='dq-days'){ S.dataQ.days=+t.value; loadData(); }
  if(t.id==='dq-make'){ S.dataQ.make=t.value; loadData(); }
  if(t.id==='dq-sold'){ S.dataQ.sold_only=t.checked; loadData(); }
});
document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&S.user) gatherLoop(); });
$('#signout').onclick=async()=>{ await sb.auth.signOut(); Object.assign(S,{user:null,role:null,cars:[],items:[],carData:null,research:null,data:null,status:null}); draw(); };

/* ===== Boot ===== */
(async()=>{
  if(!sb){ draw(); return; }
  const {data}=await sb.auth.getSession();
  S.user=data.session?.user||null; draw();
  if(S.user) afterLogin();
})();
</script>
</body>
</html>
