<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15191D">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>QuickPull</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: one phone-first column under a sticky bar. Paint-marker yellow marks money and stock numbers, like a yard windshield. */
:root{
  --bg:#ECEDE9; --surface:#FFFFFF; --sunk:#E2E4DF; --ink:#15191D; --muted:#5C636A; --line:#D2D5CF;
  --action:#1D4E89; --action-ink:#FFFFFF; --marker:#F2C14E; --marker-ink:#1F1800;
  --ok:#1C7446; --ok-bg:#DBEFE2; --hold:#8F5B00; --hold-bg:#FAE9C4; --gone:#858B91; --bad:#B3261E; --bad-bg:#F7DDDA;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#111417; --surface:#1A1E22; --sunk:#22272C; --ink:#E8EBED; --muted:#9AA2A9; --line:#2D3339;
  --action:#6FA5E9; --action-ink:#0A1420; --marker:#E9BA40; --marker-ink:#1F1800;
  --ok:#5DCB8C; --ok-bg:#15301F; --hold:#EAB54C; --hold-bg:#382A0E; --gone:#6D747A; --bad:#F2897F; --bad-bg:#3B1815; color-scheme:dark}}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.1;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:1.9rem} h2{font-size:1.4rem} h3{font-size:1.15rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--action);outline-offset:2px}
a{color:var(--action)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:.875rem}
.label{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:760px;margin:0 auto;padding-block:10px;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.35rem;letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;gap:8px;margin-right:auto}
.brand i{display:inline-block;width:14px;height:14px;background:var(--marker);border-radius:3px;transform:rotate(45deg)}
.tabs{max-width:760px;margin:0 auto;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:8px 10px 10px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--action)}
.tabs .count{font-family:var(--f-mono);font-size:.75rem;background:var(--sunk);border-radius:999px;padding:1px 7px;margin-left:4px}
main{max-width:760px;margin:0 auto;padding-block:18px 100px;display:flex;flex-direction:column;gap:16px}
.banner{background:var(--hold-bg);color:var(--hold);border-radius:10px;padding:10px 14px;font-size:.9rem;font-weight:500}
.banner.bad{background:var(--bad-bg);color:var(--bad)} .banner.info{background:var(--sunk);color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:8px;padding:11px 16px;font-weight:700;background:var(--action);color:var(--action-ink);cursor:pointer;text-decoration:none;min-height:44px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.quiet{background:var(--sunk);color:var(--ink)}
.btn.good{background:var(--ok);color:var(--surface)}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.btn.sm{padding:6px 10px;min-height:34px;font-size:.875rem;border-radius:7px}
.btn.block{width:100%}
.linkbtn{border:0;background:none;color:var(--action);font-weight:600;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.inp{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;min-height:44px;width:100%}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:460px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.panel-h{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.panel-b{padding:14px 16px}
.vin{font-family:var(--f-mono);font-size:1.2rem;letter-spacing:.06em;text-transform:uppercase}
.money{font-family:var(--f-display);font-weight:800;font-variant-numeric:tabular-nums}
.stock{font-family:var(--f-mono);font-weight:600;background:var(--marker);color:var(--marker-ink);padding:2px 7px;border-radius:4px;font-size:.8rem}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.76rem;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.fast{background:var(--ok-bg);color:var(--ok)}
.chip.steady{background:var(--hold-bg);color:var(--hold)}
.chip.slow{background:var(--bad-bg);color:var(--bad)}
.chip.unknown{background:var(--sunk);color:var(--muted)}
.chip.pulled{background:var(--hold-bg);color:var(--hold)} .chip.listed{background:var(--sunk);color:var(--action)} .chip.sold{background:var(--ok-bg);color:var(--ok)} .chip.scrapped{background:var(--sunk);color:var(--gone)}
.verdict{border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--ink);color:var(--surface)}
.verdict .money{font-size:2.6rem;line-height:1;color:var(--marker)}
.verdict .muted{color:color-mix(in srgb,var(--surface) 70%,transparent)}
.verdict ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:2px}
.prow{border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.prow>button.ph{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:12px 16px;border:0;background:none;text-align:left;cursor:pointer;align-items:center}
.prow .nm{font-weight:600}
.prow .meta{grid-column:1/-1;display:flex;gap:8px 12px;flex-wrap:wrap;align-items:center;font-size:.85rem;color:var(--muted)}
.prow .val{text-align:right}
.prow .val b{display:block;font-family:var(--f-mono);font-size:1rem;color:var(--ink)}
.prow .detail{padding:0 16px 14px;display:flex;flex-direction:column;gap:12px}
.kv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:460px){.kv{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kv div{background:var(--sunk);border-radius:8px;padding:8px 10px}
.kv b{display:block;font-family:var(--f-mono);font-size:1rem}
.cam{position:relative;background:#000;border-radius:12px;overflow:hidden;aspect-ratio:4/3;max-width:100%}
.cam video{width:100%;height:100%;object-fit:cover}
.cam .box{position:absolute;left:8%;right:8%;top:38%;bottom:38%;border:3px solid var(--marker);border-radius:10px;box-shadow:0 0 0 999px rgb(0 0 0/.35)}
.cam .tip{position:absolute;left:0;right:0;bottom:10px;text-align:center;color:#fff;font-weight:600;font-size:.9rem}
.list .item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:12px 16px;border-top:1px solid var(--line);align-items:center}
.list .item:first-child{border-top:0}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.kpi b{display:block;font-family:var(--f-display);font-size:1.6rem;font-variant-numeric:tabular-nums}
.empty{text-align:center;padding:32px 16px;display:flex;flex-direction:column;gap:10px;align-items:center}
.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:999px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0/.12)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:999px;font-weight:600;z-index:20;max-width:calc(100% - 32px)}
.spinner{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;display:inline-block;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation:none}}
table.pt{width:100%;border-collapse:collapse;font-size:.9rem}
table.pt th,table.pt td{padding:8px 12px;border-top:1px solid var(--line);text-align:left;white-space:nowrap}
table.pt th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;border-top:0}
table.pt td:first-child{white-space:normal;min-width:160px}
.seg label{border-radius:999px;font-weight:600;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.seg label:has(input:checked){background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0/.12)}
.seg label input{accent-color:var(--action)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip-f{border:1.5px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:5px 11px;font-weight:600;font-size:.82rem;cursor:pointer}
.chip-f[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.dup{background:var(--hold-bg);color:var(--hold);border-radius:10px;padding:10px 14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:.9rem}
.sku{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.list .item{color:inherit;font:inherit}
textarea.inp{line-height:1.5}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumb{position:relative;width:84px;height:84px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--sunk)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:999px;border:0;background:rgb(0 0 0/.6);color:#fff;font-size:14px;line-height:24px;cursor:pointer;padding:0}
.addph{width:84px;height:84px;border:1.5px dashed var(--line);border-radius:8px;display:grid;place-items:center;text-align:center;font-size:.8rem;color:var(--muted);cursor:pointer}
.addph input{display:none}
.steps{counter-reset:st}.steps>.panel{counter-increment:st}.steps>.panel>.panel-h h2::before{content:counter(st) ". ";color:var(--muted)}
.ai{background:var(--sunk);border-radius:10px;padding:10px 12px}
</style>
</head>
<body>
<header class="top">
  <div class="top-in gut"><div class="brand"><i aria-hidden="true"></i>QuickPull</div><button class="linkbtn small" id="signout" hidden>Sign out</button></div>
  <nav class="tabs gut" id="tabs" aria-label="Sections" hidden></nav>
</header>
<main class="gut" id="app"><div class="empty"><span class="spinner"></span></div></main>
<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script src="config.js"></script>
<script>
/* ===== Settings you may want to tune ===== */
const FEE_RATE = 0.136;       // eBay final value fee, roughly, for car & truck parts
const FEE_FIXED = 0.40;       // per-order fee
const PACK = {S:2, M:4};      // boxes, tape, padding per part
const BINS = {'Modules':'A','Dash & audio':'B','Switches':'C','Sensors & cameras':'D','Engine bay (small)':'E','Lights & mirrors':'F','Keys & body':'G','Also found':'H'};

/* ===== Helpers ===== */
const $ = (s,el=document)=>el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = (n,d=0) => n==null||n===''||!isFinite(n) ? '—' : '$'+Number(n).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d});
const ago = t => { if(!t) return 'never'; const s=(Date.now()-new Date(t))/1000; if(s<90) return 'just now'; if(s<5400) return Math.round(s/60)+' min ago'; if(s<129600) return Math.round(s/3600)+' hr ago'; return Math.round(s/86400)+' days ago'; };
const sleep = ms => new Promise(r=>setTimeout(r,ms));
let toastT; const toast = m => { const t=$('#toast'); t.textContent=m; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,3000); };
const vName = v => [v.year,v.make,v.model].filter(Boolean).join(' ') || 'Decoding…';
const takeHome = (price,size) => price==null ? null : price*(1-FEE_RATE) - FEE_FIXED - (PACK[size]||4);
const chicagoDay = d => new Date(d).toLocaleDateString('en-CA',{timeZone:'America/Chicago'});
const today = () => chicagoDay(Date.now());
const soldUrl = (v,words='') => 'https://www.ebay.com/sch/i.html?'+new URLSearchParams({_nkw:`${v.year} ${v.make} ${v.model} ${words}`.trim(),_sacat:'6030',LH_Sold:'1',LH_Complete:'1',LH_ItemCondition:'3000',_sop:'16',_ipg:'240'});
const tpUrl = (v,words='') => 'https://www.ebay.com/sh/research?'+new URLSearchParams({marketplace:'EBAY-US',keywords:`${v.year} ${v.make} ${v.model} ${words}`.trim(),dayRange:'90',categoryId:'6030',tabName:'SOLD'});
const DEST = {pull:['fast','Pull area'],shred:['unknown','Shred'],waiting:['steady','Waiting on data']};
const CATS = [['modules','Computers & modules'],['electronics','Electronics'],['lights','Lights'],['mirrors','Mirrors'],['plastic','Plastic & trim'],['engine','Engine bay (small)'],['keys','Keys & security'],['other','Other'],['large','Large parts']];
const CATNAME = Object.fromEntries(CATS);
// Multi-select filter chips. S.cats is shared by every screen; empty = everything.
function chips(opts={}){
  const list = CATS.filter(([k])=> opts.large ? true : k!=='large');
  return `<div class="chips" role="group" aria-label="Filter by part type"><button class="chip-f" data-act="cat" data-c="" aria-pressed="${!S.cats.length}">All</button>${list.map(([k,l])=>`<button class="chip-f" data-act="cat" data-c="${k}" aria-pressed="${S.cats.includes(k)}">${l}</button>`).join('')}</div>`;
}
const catOk = c => !S.cats.length || S.cats.includes(c||'other');
function spark(weeks){
  const max=Math.max(1,...weeks), w=8, gap=3, h=28;
  return `<svg width="${weeks.length*(w+gap)}" height="${h+12}" role="img" aria-label="Sales per week, last 12 weeks: ${weeks.join(', ')}">${weeks.map((n,i)=>`<rect x="${i*(w+gap)}" y="${h-Math.round(n/max*h)}" width="${w}" height="${Math.max(1,Math.round(n/max*h))}" rx="2" fill="${n?'var(--action)':'var(--line)'}"/>`).join('')}<text x="0" y="${h+11}" font-size="9" fill="var(--muted)">12 wks ago</text><text x="${weeks.length*(w+gap)-gap}" y="${h+11}" font-size="9" fill="var(--muted)" text-anchor="end">this wk</text></svg>`;
}
const SPEED = {fast:'Fast seller', steady:'Steady', slow:'Slow', unknown:'No sold dates'};
const TREND = {up:' ↑', down:' ↓', flat:''};
function speedText(sp){ if(!sp||!sp.per90) return ''; return sp.every_days<=1.5?`sells ~${Math.round(sp.per_week)}/week`:`sells every ${sp.every_days} days`; }
function genLine(g, lk, v){
  if(!g){
    if(!lk) return `<span class="muted">Generation: looking it up in the background…</span> <button class="linkbtn" data-act="lookupgen">Look up now</button>`;
    return `<span class="muted">Generation: ${lk.status==='no_article'?'no Wikipedia article found':'not found yet'}.</span> <button class="linkbtn" data-act="lookupgen">Try again</button> · <button class="linkbtn" data-act="editgen">Set it yourself</button>`;
  }
  const sis=(g.sisters||[]).map(x=>`${x.make} ${x.model} ${x.year_from}–${x.year_to}`).join(', ');
  return `<b>Generation ${g.year_from}–${g.year_to}</b>${g.refresh_years?.length?` · facelift ${g.refresh_years.join(', ')} (lights, bumpers, radios may differ)`:''}${sis?` · shares parts with ${esc(sis)}`:''} · <span class="muted">${g.edited?'set by you':`rough estimate from <a href="${esc(g.source_url)}" target="_blank" rel="noopener">Wikipedia ↗</a>`}</span> · <button class="linkbtn" data-act="editgen">Edit</button>`;
}
function genEditor(){
  const E=S.genEdit; if(!E) return '';
  return `<form class="panel panel-b stack" data-form="gen"><h3>Generation for ${esc(E.vehicle.make)} ${esc(E.vehicle.model)}</h3>
   <div class="row"><input class="inp" style="width:100px" name="yf" inputmode="numeric" value="${esc(E.year_from)}"><span>to</span><input class="inp" style="width:100px" name="yt" inputmode="numeric" value="${esc(E.year_to)}"></div>
   <label class="field"><span class="label">Shares parts with (one per line, e.g. "GMC Terrain 2010-2017")</span><textarea class="inp" name="sis" rows="3">${esc(E.sisters)}</textarea></label>
   <div class="row"><button class="btn sm">Save</button><button type="button" class="btn sm ghost" data-act="canceledit">Cancel</button></div></form>`;
}
const REASON = {under_cutoff:'Under the cutoff', never_pull:'On your Never-pull list', same_unit:'Same unit as another part', merged:'Merged into another part', no_data:'No price data yet'};
const destOf = v => v.decision || v.destination || 'waiting';

/* ===== Supabase ===== */
const CFG = window.QUICKPULL_CONFIG || {};
const configured = CFG.supabaseUrl && !/PASTE_/.test(CFG.supabaseUrl) && CFG.supabaseKey && !/PASTE_/.test(CFG.supabaseKey);
const sb = configured ? supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey) : null;
async function fn(body){
  const { data, error } = await sb.functions.invoke('ebay-lookup', { body, headers:{ apikey: CFG.supabaseKey } });
  if(error){ let msg=error.message; try{ const j=await error.context.json(); msg=j.error||msg; }catch{} throw new Error(msg); }
  return data;
}

/* ===== State ===== */
const S = { user:null, role:null, tab:'checkin', err:'', busy:{}, status:null,
  vinText:'', lastAdd:null, day:'today', cars:[], gather:{running:false, info:null},
  car:null, carData:null, showHidden:false, open:{},
  research:null, // {vehicle, text, preview, from, to}
  items:[], shelfFilter:'pulled', people:[], data:null, scanning:false, cats:[], dataQ:{days:30,make:'',model:'',sold_only:false,tab:'small'}, shelfQ:'', notCounted:false, large:null, sell:null, ebay:null };
const isOwner = () => S.role==='owner';

/* ===== Rendering ===== */
function draw(){
  const tabs=$('#tabs');
  if(!S.user){ tabs.hidden=true; $('#signout').hidden=true; $('#app').innerHTML = configured ? vLogin() : vSetup(); return; }
  tabs.hidden=false; $('#signout').hidden=false;
  const list = isOwner() ? [['checkin','Check-in'],['research','Research'],['shelf','Shelf',S.items.filter(i=>i.status==='pulled'||i.status==='listed').length],['data','Data'],['settings','Settings']] : [['checkin','Check-in']];
  const cur = S.tab==='car' ? 'checkin' : S.tab;
  tabs.innerHTML=list.map(([k,l,c])=>`<button data-act="tab" data-t="${k}" ${cur===k?'aria-current="page"':''}>${l}${c?`<span class="count">${c}</span>`:''}</button>`).join('');
  const ae=document.activeElement, fid=ae?.id, sel=fid&&ae.selectionStart!=null?[ae.selectionStart,ae.selectionEnd]:null;
  const views={checkin:vCheckin, car:vCar, research:vResearch, shelf:()=>S.sell?vSell():vShelf(), data:vData, settings:vSettings};
  $('#app').innerHTML = (S.err?`<div class="banner bad">${esc(S.err)}</div>`:'') + setupBanner() + (views[S.tab]||vCheckin)();
  if(fid){ const el=document.getElementById(fid); if(el){ el.focus({preventScroll:true}); if(sel&&el.setSelectionRange) try{ el.setSelectionRange(...sel);}catch{} } }
  if(S.scanning) attachCamera();
}
function setupBanner(){
  const st=S.status; if(!st||!isOwner()) return '';
  if(!st.ebay_keys) return `<div class="banner bad">eBay keys aren't set up yet. Add EBAY_CLIENT_ID and EBAY_CLIENT_SECRET in Supabase → Edge Functions → Secrets.</div>`;
  return '';
}

/* ---- Research ---- */
function vResearch(){
  if(S.research) return researchPanel();
  const since=Date.now()-60*864e5;
  const by=new Map();
  for(const c of S.cars){ if(!c.platform||new Date(c.scanned_at)<since) continue; const g=by.get(c.platform)||{platform:c.platform,year:c.year,make:c.make,model:c.model,cars:0,value:0}; g.cars++; g.value=Math.max(g.value,Number(c.est_value||0)); by.set(c.platform,g); }
  const plats=[...by.values()].map(g=>({...g,info:S.platforms?.[g.platform]})).sort((a,b)=>(!!a.info?.researched_at - !!b.info?.researched_at) || (b.cars-a.cars) || (b.value-a.value));
  const done=plats.filter(p=>p.info?.researched_at).length;
  const log=S.chromeLog||[];
  return `<div class="stack"><h1>Research queue</h1><p class="muted">Models you bought in the last 60 days, most common first. Open eBay's sold listings, copy the page, paste it here. One paste covers every part on that model.</p></div>
  <details class="panel"><summary class="panel-h" style="cursor:pointer"><h3>Let Claude in Chrome do it</h3><span class="small muted">${researchQueue().length} model${researchQueue().length===1?'':'s'} waiting</span></summary><div class="panel-b stack small">
   <p>Claude in Chrome can work through this queue: it opens each model's public eBay sold page, reads it, and saves it here the same way a paste would. It covers each model's whole generation.</p>
   <ol style="margin:0;padding-left:18px"><li>Use a Chrome profile that is <b>not</b> signed in to eBay, with this page open and signed in.</li><li>In Claude, run the <b>quickpull-chrome-research</b> skill (or say "research my QuickPull queue in Chrome").</li><li>It stops on its own if eBay shows a captcha, a sign-in page or a block page, and does at most 10 models per run.</li></ol>
   ${log.length?`<div class="list">${log.slice(0,8).map(l=>`<div class="item"><span>${esc(l.name)}</span><span class="muted">${l.saved} saved · ${ago(l.at)}</span></div>`).join('')}</div>`:''}
  </div></details>
  <div class="kpis"><div class="kpi"><span class="label">Models</span><b>${plats.length}</b></div><div class="kpi"><span class="label">Researched</span><b>${done}</b></div><div class="kpi"><span class="label">To do</span><b>${plats.length-done}</b></div></div>
  ${plats.length?`<div class="panel list">${plats.map(p=>`<div class="item"><div><b>${esc(vName(p))}</b><div class="small muted">${p.cars} car${p.cars>1?'s':''} bought · ${p.info?.researched_at?'researched '+ago(p.info.researched_at):'not researched'}</div></div><button class="btn sm ${p.info?.researched_at?'quiet':''}" data-act="research" data-p="${esc(p.platform)}">Research</button></div>`).join('')}</div>`:`<div class="panel empty"><p class="muted">Check in some cars first.</p></div>`}`;
}
const SOURCES=[['ebay','eBay sold page (last 90 days)',null],['tp90','Terapeak · last 90 days',90],['tp180','Terapeak · last 6 months',182],['tp365','Terapeak · last year',365],['tp730','Terapeak · last 2 years',730],['tp1095','Terapeak · last 3 years',1095]];

/* ---- Shelf ---- */
function vShelf(){
  const f=S.shelfFilter, q=S.shelfQ.trim().toLowerCase(); const items=S.items.filter(i=>(f==='all'||i.status===f)&&(!q||[i.sku,i.part_name,i.stock_no,i.shelf,i.platform].join(' ').toLowerCase().includes(q)));
  const cnt=k=>S.items.filter(i=>i.status===k).length;
  const soldSum=S.items.filter(i=>i.status==='sold').reduce((s,i)=>s+Number(i.sold_price||0),0);
  return `<div class="kpis"><div class="kpi"><span class="label">To list</span><b>${cnt('pulled')}</b></div><div class="kpi"><span class="label">Listed</span><b>${cnt('listed')}</b></div><div class="kpi"><span class="label">Sold</span><b>${money(soldSum)}</b></div></div>
  <details class="panel"><summary class="panel-h" style="cursor:pointer"><h3>Bin guide</h3></summary><div class="panel-b small" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px">${Object.entries(BINS).map(([g,l])=>`<div><span class="stock">${l}</span> ${esc(g)}</div>`).join('')}</div></details>
  <div class="row between"><div class="seg" role="group" aria-label="Filter">${[['pulled','To list'],['listed','Listed'],['sold','Sold'],['all','All']].map(([k,l])=>`<button data-act="filter" data-f="${k}" aria-pressed="${f===k}">${l}</button>`).join('')}</div>
   <input class="inp" id="shelfq" style="max-width:240px" placeholder="Search SKU, part, stock #" value="${esc(S.shelfQ)}" autocomplete="off"></div>
  ${items.length?`<div class="panel list">${items.map(i=>`<div class="item"><div><div style="font-weight:600">${esc(i.part_name)}${i.grade?` <span class="mono small">· ${esc(i.grade)}</span>`:''}</div><div class="sku">${esc(i.sku||'')}${i.part_numbers?.length?` · #${esc(i.part_numbers.join(', '))}`:''}${i.photos?.length?` · ${i.photos.length} photo${i.photos.length>1?'s':''}`:''}</div><div class="small muted">${i.shelf?`<span class="stock">${esc(i.shelf)}</span> `:''}${esc(i.stock_no||'')} · ${esc((([mk,md,yr])=>[yr,mk,md].join(' '))((i.platform||'').split('|')).replace(/-/g,' '))}</div></div>
   <span class="chip ${i.status}">${{pulled:'To list',listed:'Listed',sold:'Sold',scrapped:'Scrapped'}[i.status]||i.status}</span>
   <form class="row" style="grid-column:1/-1" data-form="item" data-id="${i.id}">
    ${i.status==='pulled'?`<button type="button" class="btn sm" data-act="sell" data-id="${i.id}">${i.photos?.length?'Continue listing':'Photos & list on eBay'}</button><input class="inp" style="width:110px" id="lp-${i.id}" name="price" inputmode="decimal" placeholder="List price" value="${esc(i.list_price??'')}"><button class="btn sm ghost" name="to" value="listed">Listed elsewhere</button>${i.listing_error?`<span class="small" style="color:var(--bad);flex-basis:100%">Last try: ${esc(i.listing_error)}</span>`:''}`:''}
    ${i.status==='listed'?`<span class="small muted">Listed ${money(i.list_price)} · ${ago(i.listed_at)}</span>${i.ebay_listing_id?`<a class="small" href="https://www.ebay.com/itm/${esc(i.ebay_listing_id)}" target="_blank" rel="noopener">On eBay ↗</a><button type="button" class="linkbtn small" data-act="sell" data-id="${i.id}">Edit</button>`:''}<input class="inp" style="width:120px" id="sp-${i.id}" name="price" inputmode="decimal" placeholder="Sold for" value="${esc(i.list_price??'')}"><button class="btn sm good" name="to" value="sold">Sold</button>`:''}
    ${i.status==='sold'?`<span class="small muted">Sold ${money(i.sold_price)} · ${ago(i.sold_at)}${i.channel==='ebay'&&i.ebay_listing_id?' on eBay':''}</span>`:''}
    ${i.status!=='sold'&&i.status!=='scrapped'?`<button class="linkbtn small" name="to" value="scrapped" style="margin-left:auto">Scrap</button>`:''}
   </form></div>`).join('')}</div>`:`<div class="panel empty"><p class="muted">Nothing here yet. Open a car and tap “Add to shelf” on a part.</p></div>`}`;
}

/* ---- Sell one part: photos → AI read → listing → publish ---- */
function vSell(){
  const X=S.sell, i=S.items.find(x=>x.id===X.id); if(!i){ S.sell=null; return vShelf(); }
  const ph=i.photos||[], eb=S.ebay, D=X.draft, ai=X.ai;
  const ready=eb?.connected&&eb.fulfillment_policy_id&&eb.payment_policy_id&&eb.return_policy_id&&eb.location;
  const fitTxt=D?(D.fitText??D.fit.map(f=>`${f.year_from}${f.year_to!==f.year_from?'-'+f.year_to:''} ${f.make} ${f.model}`).join('\n')):'';
  const aspTxt=D?(D.aspText??Object.entries(D.aspects||{}).map(([k,v])=>`${k}: ${v.join(', ')}`).join('\n')):'';
  const missing=D?(D.aspect_hints||[]).filter(a=>a.required&&!new RegExp('^'+a.name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\s*:\\s*\\S','mi').test(aspTxt)):[];
  return `<button class="linkbtn" data-act="closesell">← Shelf</button>
  <div class="stack" style="gap:4px"><h1>${esc(i.part_name)}</h1><div class="sku">${esc(i.sku||'')} · ${esc((([mk,md,yr])=>[yr,mk,md].join(' '))((i.platform||'').split('|')).replace(/-/g,' '))}${i.grade?` · grade ${esc(i.grade)}`:''}</div></div>
  ${i.status==='listed'&&i.ebay_listing_id?`<div class="banner">Listed on eBay. <a href="https://www.ebay.com/itm/${esc(i.ebay_listing_id)}" target="_blank" rel="noopener">Open listing ↗</a> Changes below update the same listing.</div>`:''}
  <div class="steps stack">
  <div class="panel"><div class="panel-h"><h2>Photos</h2><span class="small muted">${ph.length}/12</span></div><div class="panel-b stack">
   <p class="small muted">Take the label with the part number up close, then every side. Plain background, good light. eBay shows the first photo in search.</p>
   <div class="thumbs">${ph.map((p,n)=>`<div class="thumb"><img src="${esc(p.url)}" alt="Photo ${n+1}" loading="lazy"><button data-act="delphoto" data-n="${n}" aria-label="Remove photo ${n+1}">×</button></div>`).join('')}
    ${ph.length<12?`<label class="addph">${S.busy.upload?'<span class="spinner"></span>':'+ Add<br>photos'}<input type="file" id="photoin" accept="image/*" multiple ${S.busy.upload?'disabled':''}></label>`:''}</div></div></div>

  <div class="panel"><div class="panel-h"><h2>Part number & condition</h2>${i.confirmed_at?'<span class="chip fast">Checked</span>':''}</div><div class="panel-b stack">
   <div><button class="btn sm ${ai?'quiet':''}" data-act="airead" ${S.busy.ai||!ph.length?'disabled':''}>${S.busy.ai?'<span class="spinner"></span> Reading photos…':ai?'Read photos again':'Read photos with AI'}</button>${!ph.length?' <span class="small muted">Add photos first.</span>':''}</div>
   ${ai?`<div class="ai small">${ai.is_this_part===false?'<b style="color:var(--bad)">This may not be the right part. Check the photos.</b><br>':''}AI read: ${ai.part_numbers.length?ai.part_numbers.map(x=>`<b class="mono">${esc(x)}</b>`).join(', '):'no part number it could read clearly'} · grade <b>${esc(ai.grade||'?')}</b>${ai.notes?` · ${esc(ai.notes)}`:''}</div>`:''}
   <form class="stack" data-form="confirm">
    <label class="field"><span class="label">Part numbers (one per line) · check them against the label</span><textarea class="inp mono" name="pns" rows="2" data-sf="pns">${esc(X.pns??(i.part_numbers||[]).join('\n'))}</textarea></label>
    <div class="row"><label class="field" style="width:auto"><span class="label">Grade</span><select class="inp" name="grade" style="width:auto">${['A','B','C'].map(g=>`<option ${((X.grade??i.grade)===g)?'selected':''}>${g}</option>`).join('')}</select></label>
    <label class="field" style="flex:1;min-width:200px"><span class="label">Condition note for buyers</span><input class="inp" name="cond" data-sf="cond" value="${esc(X.cond??i.condition_text??'')}" maxlength="300"></label></div>
    <div><button class="btn sm" ${S.busy.confirm?'disabled':''}>${S.busy.confirm?'<span class="spinner"></span> Saving…':'Looks right, save'}</button></div>
   </form>
   ${X.fits?.length?`<div class="small"><span class="label">Same part number, other cars</span>${X.fits.map(r=>`<div><b class="mono">${esc(r.part_number)}</b>: ${r.fits.length?r.fits.map(f=>`${esc(f.make)} ${esc(f.model)} ${f.year_from??''}${f.year_to&&f.year_to!==f.year_from?'–'+f.year_to:''}`).join(' · '):'only this car so far'}</div>`).join('')}</div>`:''}
  </div></div>

  <div class="panel"><div class="panel-h"><h2>Listing</h2></div><div class="panel-b stack">
   <div><button class="btn sm ${D?'quiet':''}" data-act="draft" ${S.busy.draft?'disabled':''}>${S.busy.draft?'<span class="spinner"></span> Writing listing…':D?'Rebuild listing':'Write listing'}</button></div>
   ${D?.template?`<div class="ai small stack" style="gap:6px"><div><b>Learned from ${D.template.sold_titles} sold title${D.template.sold_titles===1?'':'s'} and ${D.template.live} top live listing${D.template.live===1?'':'s'}.</b>${D.template.notes?' '+esc(D.template.notes):''}</div>
    ${D.template.photos?.tips?.length?`<div>Photos: about ${esc(D.template.photos.count||8)} · ${D.template.photos.tips.map(esc).join(' · ')}</div>`:''}
    ${(D.template.description_points||[]).length||(D.template.claim_words||[]).length?`<div>Top listings also say this. <b>Add only what's true for this part:</b></div><div class="chips">${[...(D.template.description_points||[]).map(x=>['point',x]),...(D.template.claim_words||[]).map(x=>['word',x])].map(([k,x])=>`<button class="chip-f" data-act="addpoint" data-k="${k}" data-x="${esc(x)}">+ ${esc(x)}</button>`).join('')}</div>`:''}</div>`:''}
   ${D?`<label class="field"><span class="label">Title · <span id="tlen">${(D.title||'').length}</span>/80</span><input class="inp" data-sf="title" maxlength="80" value="${esc(D.title)}"></label>
   <div class="row"><label class="field" style="width:130px"><span class="label">Price $</span><input class="inp" data-sf="price" inputmode="decimal" value="${esc(D.price??'')}"></label>
    <label class="field" style="flex:1;min-width:180px"><span class="label">eBay category${D.category_name?' · '+esc(D.category_name):''}</span><input class="inp mono" data-sf="category_id" inputmode="numeric" value="${esc(D.category_id||'')}" placeholder="category number"></label></div>
   <label class="field"><span class="label">Fits (one per line: years make model)${D.generation?` · generation is ${D.generation.year_from}–${D.generation.year_to}`:''}</span><textarea class="inp" rows="3" data-sf="fitText">${esc(fitTxt)}</textarea></label>
   ${D.generation&&D.fit?.length===1?`<div><button class="linkbtn small" data-act="usegen">Use the whole generation (${D.generation.year_from}–${D.generation.year_to})</button> <span class="small muted">only if you're sure the part number is the same across those years</span></div>`:''}
   <label class="field"><span class="label">Item specifics (Name: value)</span><textarea class="inp" rows="${Math.min(10,aspTxt.split('\n').length+1)}" data-sf="aspText">${esc(aspTxt)}</textarea></label>
   ${missing.length?`<div class="small" style="color:var(--bad)">eBay requires: ${missing.map(a=>`<b>${esc(a.name)}</b>${a.values?.length?` (e.g. ${esc(a.values.slice(0,3).join(', '))})`:''}`).join(' · ')}</div>`:''}
   <details><summary class="small" style="cursor:pointer">Description</summary><textarea class="inp" rows="8" data-sf="description" style="margin-top:6px">${esc(D.description)}</textarea></details>
   <p class="small muted">Package: ${D.size==='M'?'medium box, 10 lb':'small box, 3 lb'} · shipping, payment and returns use your eBay policies.</p>`:''}
  </div></div>

  <div class="panel"><div class="panel-h"><h2>Publish</h2></div><div class="panel-b stack">
   ${!eb?'<p class="small muted"><span class="spinner"></span> Checking your eBay connection…</p>':!ready?`<p class="small">Finish <b>Settings → eBay selling</b> first (${!eb.connected?'connect your eBay account':'pick your policies and ship-from ZIP'}).</p><div><button class="btn sm quiet" data-act="tab" data-t="settings">Open Settings</button></div>`:''}
   ${i.listing_error?`<div class="banner bad">${esc(i.listing_error)}</div>`:''}
   <div><button class="btn good" data-act="publish" ${!ready||!D||!ph.length||S.busy.publish?'disabled':''}>${S.busy.publish?'<span class="spinner"></span> Publishing…':i.ebay_listing_id?'Update eBay listing':'Publish to eBay'}</button></div>
  </div></div>
  </div>`;
}

/* ---- Data ---- */
function vData(){
  const D=S.data, Q=S.dataQ, st=S.status||{};
  const head=`<div class="stack"><h1>Data gathering</h1><p class="muted">Values are clean prices for parts over the cutoff, counted the same way as each car's pull sheet. Duplicates and Never-pull parts are left out.</p></div>
  <div class="row">
   <select class="inp" id="dq-days" style="width:auto">${[[7,'Last 7 days'],[30,'Last 30 days'],[90,'Last 90 days'],[365,'Last year'],[3650,'All time']].map(([d,l])=>`<option value="${d}" ${+Q.days===d?'selected':''}>${l}</option>`).join('')}</select>
   <select class="inp" id="dq-make" style="width:auto"><option value="">All makes</option>${(S.dataMakes||D?.makes||[]).map(m=>`<option ${Q.make===m?'selected':''}>${esc(m)}</option>`).join('')}</select>
   <label class="chk small" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="dq-sold" ${Q.sold_only?'checked':''}> Sold data only</label>
  </div>
  <div class="seg" role="group" aria-label="Part size"><button data-act="dtab" data-t="small" aria-pressed="${Q.tab==='small'}">Small parts</button><button data-act="dtab" data-t="large" aria-pressed="${Q.tab==='large'}">Large parts</button><button data-act="dtab" data-t="models" aria-pressed="${Q.tab==='models'}">Models</button><button data-act="dtab" data-t="fastest" aria-pressed="${Q.tab==='fastest'}">Fastest sellers</button></div>`;
  if(!D) return head+`<div class="panel empty"><span class="spinner"></span><p class="muted">Adding it up…</p></div>`;
  const t=today();
  const kpis=`<div class="kpis"><div class="kpi"><span class="label">In today</span><b>${S.cars.filter(c=>chicagoDay(c.scanned_at)===t).length}</b></div><div class="kpi"><span class="label">Waiting</span><b>${S.cars.filter(c=>c.status==='queued').length}</b></div><div class="kpi"><span class="label">eBay lookups today</span><b>${(st.calls_today??0).toLocaleString()}</b><span class="small muted">of ${(st.call_cap||4800).toLocaleString()}</span></div></div>`;
  let body='';
  if(Q.tab==='small'){
    const rows=D.parts.filter(p=>catOk(p.cat));
    body=chips()+`<div class="panel"><div class="panel-h"><h2>Top part types</h2><span class="small muted">across ${D.cars} cars</span></div><div style="overflow-x:auto"><table class="pt"><thead><tr><th>Part</th><th>Type</th><th>Cars</th><th>Avg clean</th><th>Total</th><th>Sold data</th></tr></thead><tbody>${rows.slice(0,60).map(p=>`<tr><td>${esc(p.name)}${p.discovered?' <span class="chip steady" style="font-size:.7rem">found</span>':''}</td><td class="small muted">${esc(CATNAME[p.cat]||'Other')}</td><td class="mono">${p.cars}</td><td class="mono">${money(p.avg)}</td><td class="mono"><b>${money(p.total)}</b></td><td class="small">${p.sold_share>=.5?'Sold':'Asking'}</td></tr>`).join('')||'<tr><td colspan="6" class="muted">Nothing in this filter yet.</td></tr>'}</tbody></table></div></div>`;
  } else if(Q.tab==='fastest'){
    const F=S.fastest;
    if(!F){ body=`<div class="panel empty"><span class="spinner"></span></div>`; }
    else { const rows=F.parts.filter(p=>catOk(p.cat));
      body=chips()+`<div class="panel"><div class="panel-h"><h2>Fastest sellers</h2><span class="small muted">From sold dates in your Research pastes · last 90 days · all models</span></div><div style="overflow-x:auto"><table class="pt"><thead><tr><th>Part</th><th>Sold 90d</th><th>Sells every</th><th>Trend</th><th>Typical</th><th>Clean</th><th>Models</th></tr></thead><tbody>${rows.map(p=>`<tr><td>${esc(p.name)}</td><td class="mono">${p.per90}</td><td class="mono">${p.every_days!=null?p.every_days+' d':'—'}</td><td>${p.trend==='up'?'↑ picking up':p.trend==='down'?'↓ slowing':'—'}</td><td class="mono">${money(p.median)}</td><td class="mono"><b>${money(p.high)}</b></td><td class="mono">${p.models}</td></tr>`).join('')||'<tr><td colspan="7" class="muted">No dated sales yet. Paste eBay sold pages in Research (Terapeak totals have no dates).</td></tr>'}</tbody></table></div></div>`; }
  } else if(Q.tab==='large'){
    body=`<div class="panel"><div class="panel-h"><h2>Large parts sold</h2><span class="small muted">From your Research pastes for these models · never added to car totals</span></div>${D.large.length?salesTable(D.large,true,true):'<p class="panel-b muted">No large-part sales saved yet. They come from Research pastes.</p>'}</div>`;
  } else {
    body=`<div class="panel"><div class="panel-h"><h2>Best models</h2><span class="small muted">by parts value per car</span></div><div style="overflow-x:auto"><table class="pt"><thead><tr><th>Model</th><th>Cars</th><th>Per car</th><th>Parts with sold data</th></tr></thead><tbody>${D.models.slice(0,40).map(m=>`<tr><td>${esc(vName(m))}</td><td class="mono">${m.cars}</td><td class="mono"><b>${money(m.value)}</b></td><td class="mono">${m.sold_parts}</td></tr>`).join('')||'<tr><td colspan="4" class="muted">No data yet.</td></tr>'}</tbody></table></div></div>`;
  }
  return head+kpis+body;
}
async function loadData(){
  S.data=null; draw();
  try{ S.data=await fn({action:'data',...S.dataQ}); if(!S.dataQ.make) S.dataMakes=S.data.makes; }catch(e){ S.err=e.message; }
  draw();
}

  const ok=(b,yes,no)=>`<span class="chip ${b?'fast':'slow'}">${b?yes:no}</span>`;
  return `<h1>Settings</h1>
  ${vEbaySettings()}
  <div class="panel"><div class="panel-h"><h2>Cutoff</h2></div><form class="panel-b stack" data-form="cutoff"><p class="small muted">Parts worth less than this when clean are hidden from pull sheets. Their data is kept, so lowering it later brings them back.</p>
   <div class="row"><span>$</span><input class="inp" style="width:110px" id="cutoff" name="cutoff" inputmode="numeric" value="${esc(st.part_min??60)}"><button class="btn">Save</button></div></form></div>
  <div class="panel"><div class="panel-h"><h2>Never pull</h2></div><div class="panel-b stack"><p class="small muted">These parts are left off every pull sheet and out of every car's value, and aren't searched on eBay. Their data is kept. Add parts from any pull sheet with "Never pull this part".</p>
   ${(st.never_pull||[]).length?`<div class="list">${(st.never_pull||[]).map(k=>`<div class="item"><span>${esc(partLabel(k))}</span><button class="btn sm ghost" data-act="neverpull" data-k="${esc(k)}" data-on="0">Allow again</button></div>`).join('')}</div>`:'<p class="small muted">Nothing on the list.</p>'}</div></div>
  <div class="panel"><div class="panel-h"><h2>Clean up</h2></div><div class="panel-b stack"><p class="small muted">Removes "Also found" rows made with the old rules (the engine duplicates) and re-checks every model with the new ones, a few models every 5 minutes. Your research and sales are not touched.</p>
   <div><button class="btn sm quiet" data-act="cleanup" ${S.busy.cleanup?'disabled':''}>${S.busy.cleanup?'<span class="spinner"></span> Cleaning…':'Clean up duplicates & re-check models'}</button></div></div></div>
  <div class="panel"><div class="panel-h"><h2>Backups</h2></div><div class="panel-b stack small"><p class="muted">A full copy of your data is saved automatically every week inside Supabase (Storage → backups). Download one to your computer every so often too, in case anything happens to the Supabase project.</p>
   <div class="row between"><span>Last automatic backup</span><span class="chip ${st.last_backup_at?'fast':'unknown'}">${st.last_backup_at?ago(st.last_backup_at):'Not yet'}</span></div>
   <div><button class="btn sm" data-act="backup" ${S.busy.backup?'disabled':''}>${S.busy.backup?'<span class="spinner"></span> Preparing…':'Download backup now'}</button></div></div></div>
  <div class="panel"><div class="panel-h"><h2>Setup check</h2></div><div class="panel-b stack small">
   <div class="row between"><span>eBay keys</span>${ok(st.ebay_keys,'Connected','Missing')}</div>
   <div class="row between"><span>Background timer</span>${ok(st.last_process_at&&Date.now()-new Date(st.last_process_at)<20*60e3,'Ran '+ago(st.last_process_at),st.last_process_at?'Last ran '+ago(st.last_process_at):'Not running yet')}</div>
   <div class="row between"><span>eBay sold data (Insights)</span>${ok(st.insights,'On','Off · use Research')}</div>
   <div><button class="btn sm quiet" data-act="runnow" ${S.gather.running?'disabled':''}>${S.gather.running?'<span class="spinner"></span> Gathering…':'Run gathering now'}</button></div></div></div>
  <div class="panel"><div class="panel-h"><h2>Team</h2></div><div class="panel-b stack">
   <p class="small muted">Add people in Supabase → Authentication → Users first. New people start as check-in, which only sees the Check-in page.</p>
   ${S.people.length?`<div class="list">${S.people.map(p=>`<div class="item"><span>${esc(p.email||p.user_id)}</span><span class="chip ${p.role==='owner'?'fast':'unknown'}">${p.role==='owner'?'Owner':'Check-in'}</span></div>`).join('')}</div>`:''}
   <form class="row" data-form="role"><input class="inp" style="flex:1;min-width:180px" id="roleemail" name="email" type="email" placeholder="their email"><select class="inp" style="width:auto" name="role"><option value="checkin">Check-in</option><option value="owner">Owner</option></select><button class="btn sm">Set role</button></form>
  </div></div>`;
}

function vEbaySettings(){
  const e=S.ebay;
  const head=`<div class="panel"><div class="panel-h"><h2>eBay selling</h2>${e?.connected?'<span class="chip fast">Connected</span>':''}</div><div class="panel-b stack small">`;
  if(!e) return head+`<p class="muted"><span class="spinner"></span> Checking…</p></div></div>`;
  if(e.error) return head+`<p style="color:var(--bad)">${esc(e.error)}</p></div></div>`;
  if(!e.connected) return head+`<p class="muted">Connect the eBay account you sell on so parts can be listed straight from the Shelf, and sold parts get marked sold here automatically.</p>
   ${e.runame?`<div><button class="btn sm" data-act="ebayconnect">Connect eBay account</button></div>`:`<p>First add the <span class="mono">EBAY_RUNAME</span> secret in Supabase (see the setup guide), then come back.</p>`}</div></div>`;

const SKU_CODE = {ecm:'ECM',bcm:'BCM',tcm:'TCM',abs:'ABS',fusebox:'FUSE',gateway:'GATE',telematics:'TELE',keyless:'KEYLS',fpdm:'FPDM',liftgate_mod:'LGMOD',seat_mod:'SEATMOD',parkassist:'PAMOD',radio:'RADIO',display:'DISP',hud:'HUD',cluster:'CLUS',amp:'AMP',hvac:'HVAC',media_hub:'USB',clock_dash:'DSW',window_master:'WMSW',headlight_sw:'HLSW',column_sw:'COLSW',sw_controls:'SWC',push_start:'PUSH',ignition:'IGN',seat_sw:'SEATSW',mirror_sw:'MIRSW',shifter:'SHIFT',overhead:'OVHD',front_camera:'FCAM',radar:'RADAR',backup_cam:'BCAM',bsm_sensor:'BSM',park_sensor:'PDC',tpms:'TPMS',steer_angle:'SAS',rain_sensor:'RAIN',maf:'MAF',o2:'O2',map_cam:'POS',throttle:'TB',coils:'COIL',injectors:'INJ',vvt:'VVT',purge:'PURGE',blend_door:'BLEND',blower_res:'BLWR',headlight_l:'HL-L',headlight_r:'HL-R',taillight_l:'TL-L',taillight_r:'TL-R',mirror_l:'MIR-L',mirror_r:'MIR-R',keyfob:'FOB',lock_act:'LOCK',window_motor:'WMOT',handle:'HNDL',rear_mirror:'RVM',center_caps:'CAPS',emblems:'EMB'};
function skuFor(stock,key,name,grade){
  const code = SKU_CODE[key] || (key.startsWith('d:') ? 'X-'+String(name||key).split(/\s+/).map(w=>w[0]).join('').toUpperCase().slice(0,5) : key.toUpperCase().replace(/[^A-Z0-9]+/g,'-').slice(0,8));
  const base = `${stock||'NA'}-${code}-${grade}`;
  let sku=base, n=2; while(S.items.some(i=>i.sku===sku)) sku=`${base}-${n++}`;
  return sku;
}
async function addToShelf(key,form){

function shrink(file,max=1600){
  return new Promise((ok,bad)=>{ const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{ const r=Math.min(1,max/Math.max(img.width,img.height)), c=document.createElement('canvas'); c.width=Math.round(img.width*r); c.height=Math.round(img.height*r);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url); c.toBlob(b=>b?ok(b):bad(new Error('Could not read photo')),'image/jpeg',.86); };
    img.onerror=()=>{ URL.revokeObjectURL(url); bad(new Error('Could not read photo')); }; img.src=url; });
}

function attachCamera(){
  const v=$('#camv'); if(!v||!camStream) return;
  if(v.srcObject!==camStream){ v.srcObject=camStream; v.play().catch(()=>{}); }
  if(camTimer) return;
  const native = 'BarcodeDetector' in window ? new BarcodeDetector({formats:['code_39','code_128','data_matrix','qr_code','pdf417']}) : null;
  if(!native && window.ZXing && !zx){ zx=new ZXing.MultiFormatReader(); const h=new Map(); h.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[ZXing.BarcodeFormat.CODE_39,ZXing.BarcodeFormat.CODE_128,ZXing.BarcodeFormat.DATA_MATRIX,ZXing.BarcodeFormat.QR_CODE]); h.set(ZXing.DecodeHintType.TRY_HARDER,true); zx.setHints(h); }
  const c=document.createElement('canvas'), ctx=c.getContext('2d',{willReadFrequently:true});
  const tick=async()=>{
    const vid=$('#camv'); if(!S.scanning||!vid){ camTimer=null; return; }
    if(vid.readyState>=2 && vid.videoWidth){
      const w=vid.videoWidth, h=vid.videoHeight, bh=Math.round(h*0.4);
      c.width=Math.min(1600,w); c.height=Math.round(bh*c.width/w);
      ctx.drawImage(vid,0,(h-bh)/2,w,bh,0,0,c.width,c.height);
      let txt=null;
      try{
        if(native){ const r=await native.detect(c); txt=r[0]?.rawValue||null; }
        else if(zx){ const src=new ZXing.HTMLCanvasElementLuminanceSource(c); txt=zx.decodeWithState(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(src))).getText(); }
      }catch{}
      const m=txt && txt.toUpperCase().replace(/^I(?=[A-HJ-NPR-Z0-9]{17}$)/,'').match(/[A-HJ-NPR-Z0-9]{17}/);
      if(m){ stopCamera(); if(navigator.vibrate) navigator.vibrate(60); if(!S.vinText.includes(m[0])) S.vinText=(S.vinText.trim()?S.vinText.trim()+'\n':'')+m[0]; toast('VIN read: '+m[0]); draw(); return; }
    }
    camTimer=setTimeout(tick,180);
  };
  camTimer=setTimeout(tick,300);
}
function stopCamera(){ S.scanning=false; clearTimeout(camTimer); camTimer=null; if(camStream){ camStream.getTracks().forEach(t=>t.stop()); camStream=null; } draw(); }

/* ===== Claude in Chrome research helpers =====
   Claude in Chrome reads public eBay sold pages and hands the text to these. Nothing here touches eBay itself. */
function researchQueue(days=30){
  const since=Date.now()-60*864e5, old=Date.now()-days*864e5, by=new Map();
  for(const c of S.cars){ if(!c.platform||new Date(c.scanned_at)<since) continue; const g=by.get(c.platform)||{platform:c.platform,year:c.year,make:c.make,model:c.model,cars:0}; g.cars++; by.set(c.platform,g); }
  return [...by.values()].map(g=>({...g,researched_at:S.platforms?.[g.platform]?.researched_at||null}))
    .filter(g=>!g.researched_at||new Date(g.researched_at)<old).sort((a,b)=>(!!a.researched_at-!!b.researched_at)||(b.cars-a.cars));
}
window.QP={
  ready:()=>!!S.user&&isOwner(),
  queue(n=10,days=30){ return researchQueue(days).slice(0,n).map(g=>({platform:g.platform,name:vName(g),cars:g.cars,last_researched:g.researched_at,sold_url:soldUrl(g)})); },
  async research(platform,text){
    if(!this.ready()) return {error:'Sign in to QuickPull as the owner first.'};
    const c=S.cars.find(x=>x.platform===platform); if(!c) return {error:'Unknown model: '+platform};
    if(!text||text.length<200) return {error:'Page text is empty or too short. Nothing saved.'};
    const vehicle={year:c.year,make:c.make,model:c.model};
    const pv=await fn({action:'research_preview',text,vehicle});
    if(!pv.sales) return {saved:0,read:pv.read,note:'No usable used-OEM sales found on that page. Nothing saved.'};
    let yf=+c.year, yt=+c.year, sisters=[];
    try{ const g=(await fn({action:'generation',vehicle})).generation; if(g){ yf=g.year_from; yt=g.year_to; sisters=g.sisters||[]; } }catch{}
    const r=await fn({action:'research_save',text,vehicle,year_from:yf,year_to:yt,sisters});
    S.chromeLog=[{name:vName(c),saved:r.saved,at:new Date().toISOString()},...(S.chromeLog||[])].slice(0,50);
    await loadPlatforms(); if(S.tab==='research'&&!S.research) draw();
    return {model:vName(c),years:`${yf}-${yt}`,found:pv.sales,saved:r.saved,already_saved:r.already_saved||0,top:(pv.small||[]).slice(0,5).map(x=>`${x.name} ${x.count} sold, clean ${money(x.high)}`)};
  }
};

/* ===== Events ===== */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]'); if(!t) return; const a=t.dataset.act;
  if(a==='tab'){ if(S.scanning) stopCamera(); S.tab=t.dataset.t; S.research=null; S.err=''; draw(); window.scrollTo({top:0}); if(S.tab==='data') fn({action:'status'}).then(s=>{S.status=s;}).catch(()=>{}).finally(loadData); if(S.tab==='settings'){ fn({action:'status'}).then(s=>{S.status=s;draw();}).catch(()=>{}); loadEbay(); } if(S.tab!=='shelf') S.sell=null; }
  else if(a==='add') addCars();
  else if(a==='camera'){ S.scanning?stopCamera():startCamera(); }
  else if(a==='day'){ S.day=t.dataset.d; draw(); }
  else if(a==='opencar') openCar(+t.dataset.id);
  else if(a==='decide') decide(t.dataset.d);
  else if(a==='open'){ S.open[t.dataset.k]=!S.open[t.dataset.k]; draw(); }
  else if(a==='hidden'){ S.showHidden=!S.showHidden; draw(); }
  else if(a==='research'){
    if(t.dataset.from==='car') startResearch(S.carData.vehicle,'car');
    else { const c=S.cars.find(x=>x.platform===t.dataset.p); if(c) startResearch(c,'queue'); }
  }
  else if(a==='closeresearch'){ const back=S.research?.from; S.research=null; draw(); if(back==='car') window.scrollTo({top:0}); }
  else if(a==='clearpaste'){ S.research.text=''; S.research.preview=null; draw(); }
  else if(a==='preview') preview();
  else if(a==='loadsaved') loadSaved();
  else if(a==='savepaste') savePaste();
  else if(a==='filter'){ S.shelfFilter=t.dataset.f; draw(); }
  else if(a==='cat'){ const c=t.dataset.c; if(!c) S.cats=[]; else S.cats=S.cats.includes(c)?S.cats.filter(x=>x!==c):[...S.cats,c]; draw(); }
  else if(a==='neverpull') setNeverPull(t.dataset.k,t.dataset.on==='1');
  else if(a==='merge') setMerge(t.dataset.from,t.dataset.to,'merge');
  else if(a==='distinct') setMerge(t.dataset.from,t.dataset.to,'distinct');
  else if(a==='notcounted'){ S.notCounted=!S.notCounted; draw(); if(S.notCounted&&!S.large) loadLarge(); }
  else if(a==='dtab'){ S.dataQ.tab=t.dataset.t; draw(); if(t.dataset.t==='fastest') fn({action:'fastest'}).then(r=>{S.fastest=r;draw();}).catch(e=>toast(e.message)); }
  else if(a==='pninfo'){ const pn=t.dataset.pn; fn({action:'part_number',part_number:pn}).then(r=>{ S.pnInfo={...(S.pnInfo||{}),[pn]:r}; draw(); }).catch(e=>toast(e.message)); }
  else if(a==='lookupgen'){ const v=S.carData.vehicle; toast('Looking up generations…'); fn({action:'lookup_generation',make:v.make,model:v.model}).then(r=>{ toast(r.error?r.error:'Generation found'); return openCar(v.id); }).catch(e=>toast(e.message)); }
  else if(a==='editgen'){ const d=S.carData, g=d.generation, v=d.vehicle; S.genEdit={vehicle:{make:v.make,model:v.model,year:v.year},id:g?.id,year_from:g?.year_from??v.year,year_to:g?.year_to??v.year,sisters:(g?.sisters||[]).map(x=>`${x.make} ${x.model} ${x.year_from}-${x.year_to}`).join('\n')}; draw(); }
  else if(a==='canceledit'){ S.genEdit=null; draw(); }
  else if(a==='backup') downloadBackup();
  else if(a==='sell') openSell(t.dataset.id);
  else if(a==='closesell'){ S.sell=null; draw(); }
  else if(a==='delphoto') deletePhoto(+t.dataset.n);
  else if(a==='airead') aiRead();
  else if(a==='draft') makeDraft();
  else if(a==='usegen'){ const D=S.sell.draft, f=(draftOut().fit[0])||D.fit[0]; D.fitText=`${D.generation.year_from}-${D.generation.year_to} ${f.make} ${f.model}`; draw(); }
  else if(a==='publish') publish();
  else if(a==='addpoint'){ const D=S.sell?.draft; if(!D) return; const x=t.dataset.x;
    if(t.dataset.k==='word'){ const nt=`${D.title} ${x}`.trim(); if(nt.length>80){ toast('No room in the title (80 characters)'); return; } D.title=nt; }
    else D.description=String(D.description||'').replace(/(<p>You will receive)/, `<p>${esc(x)}</p>\n$1`).replace(/^(?![\s\S]*<p>You will receive)([\s\S]*)$/, `$1\n<p>${esc(x)}</p>`);
    toast('Added: '+x); draw(); }
  else if(a==='ebayconnect') ebayConnect();
  else if(a==='cleanup') cleanup();
  else if(a==='runnow'){ S.gather.running=false; fn({action:'process'}).then(r=>{ S.gather.info=r; toast(`Gathered ${r.models_done} model${r.models_done===1?'':'s'} · ${r.cars_waiting} cars still waiting`); return Promise.all([loadCars(),fn({action:'status'}).then(s=>S.status=s)]); }).catch(e=>toast(e.message)).finally(draw); }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='vinbox'){ S.vinText=t.value; const b=$('[data-act=add]'); if(b){ const n=S.vinText.split(/[\s,;]+/).filter(x=>x.replace(/[^A-Za-z0-9]/g,'').length>=17).length; b.disabled=!n; b.textContent=`Check in ${n||''} car${n===1?'':'s'}`; } }
  if(t.id==='pastebox'&&S.research){ const had=!!S.research.text; S.research.text=t.value; S.research.preview=null; if(had!==!!t.value) draw(); }
  if(t.id==='yfrom'&&S.research) S.research.yFrom=t.value;
  if(t.id==='yto'&&S.research) S.research.yTo=t.value;
  if(t.id==='psrc'&&S.research) S.research.src=t.value;
  if(t.id==='shelfq'){ S.shelfQ=t.value; draw(); }
  if(t.id==='usesis'&&S.research) S.research.useSisters=t.checked;
  if(t.dataset?.sf&&S.sell){ const k=t.dataset.sf; if(['pns','cond'].includes(k)) S.sell[k]=t.value; else if(S.sell.draft){ S.sell.draft[k]=t.value; if(k==='title'){ const n=$('#tlen'); if(n) n.textContent=t.value.length; } } }
});
document.addEventListener('submit',async e=>{
  e.preventDefault(); const f=e.target;
  if(f.id==='login'){
    S.em=$('#em').value.trim(); const pw=$('#pw').value;
    S.busy.login=true; S.err=''; draw();
    const {data,error}=await sb.auth.signInWithPassword({email:S.em,password:pw});
    S.busy.login=false;
    if(error){ S.err='That email and password didn\'t work.'; draw(); return; }
    S.user=data.user; S.err=''; draw(); afterLogin(); return;
  }
  if(f.dataset.form==='pulled') addToShelf(f.dataset.k,f);
  if(f.dataset.form==='item') updateItem(f.dataset.id,e.submitter?.value||'listed',f);
  if(f.dataset.form==='cutoff') saveCutoff(f);
  if(f.dataset.form==='role') setRole(f);
  if(f.dataset.form==='confirm') confirmItem(f);
  if(f.dataset.form==='ebaysetup') ebaySetup(f);
  if(f.dataset.form==='gen'){
    const E=S.genEdit; const sisters=f.sis.value.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{ const m=l.match(/^(\S+)\s+(.+?)(?:\s+(\d{4})\s*[-–]\s*(\d{4}))?$/); return m?{make:m[1],model:m[2],year_from:m[3]?+m[3]:undefined,year_to:m[4]?+m[4]:undefined}:null; }).filter(Boolean);
    fn({action:'save_generation',vehicle:E.vehicle,id:E.id,year_from:+f.yf.value,year_to:+f.yt.value,sisters}).then(r=>{ if(r.error){ toast(r.error); return; } toast('Generation saved'); S.genEdit=null; return openCar(S.carData.vehicle.id); }).catch(e=>toast(e.message));
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='dq-days'){ S.dataQ.days=+t.value; loadData(); }
  if(t.id==='dq-make'){ S.dataQ.make=t.value; loadData(); }
  if(t.id==='dq-sold'){ S.dataQ.sold_only=t.checked; loadData(); }
  if(t.id==='photoin'&&t.files?.length) uploadPhotos(t.files);
});
document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&S.user) gatherLoop(); });
$('#signout').onclick=async()=>{ await sb.auth.signOut(); Object.assign(S,{user:null,role:null,cars:[],items:[],carData:null,research:null,data:null,status:null}); draw(); };

/* ===== Boot ===== */
(async()=>{
  if(!sb){ draw(); return; }
  const {data}=await sb.auth.getSession();
  S.user=data.session?.user||null; draw();
  if(S.user) afterLogin();
})();
</script>
